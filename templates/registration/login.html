{% extends "base.html" %}
{% block title %}Masuk — SI-AMI UNISAN{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:60px auto;">
    <h2 style="margin-top:0;">Masuk ke SI-AMI</h2>
    <form method="post">
        {% csrf_token %}
        {% if form.errors %}
        <ul class="messages"><li class="error">Username atau password salah.</li></ul>
        {% endif %}
        <label for="id_username">Username</label>
        <input type="text" name="username" id="id_username" autofocus required>
        <label for="id_password">Password</label>
        <input type="password" name="password" id="id_password" required>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn" type="submit" style="margin-top:18px;width:100%;">Masuk</button>
    </form>
</div>
{% endblock %}
