{% extends "base.html" %}
{% block title %}Masuk — Sistem AMI Online UNISAN{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:60px auto;">
    <div class="card-header">🔒 Masuk ke SI-AMI</div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
            <div class="alert alert-error"><div>⚠️</div><div>Username atau password salah.</div></div>
            {% endif %}
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" autofocus required>
            </div>
            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button class="btn btn-primary" type="submit" style="margin-top:8px;width:100%;">Masuk</button>
        </form>
    </div>
</div>
{% endblock %}
