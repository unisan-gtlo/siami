{% extends "base.html" %}
{% load static %}
{% block title %}Masuk — Sistem AMI Online UNISAN{% endblock %}
{% block content %}
<div style="text-align:center;margin-top:60px;">
    <img src="{% static 'img/logo-unisan.png' %}" alt="Logo UNISAN" style="width:96px;height:96px;object-fit:contain;">
</div>
<div class="card" style="max-width:380px;margin:16px auto 60px;">
    <div class="card-header">🔒 Masuk ke SI-AMI</div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
            <div class="alert alert-error"><div>⚠️</div><div>Username atau password salah.</div></div>
            {% endif %}
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" autofocus required>
            </div>
            <div class="form-group">
                <label for="id_password">Password</label>
                <div style="position:relative;">
                    <input type="password" name="password" id="id_password" required style="padding-right:40px;">
                    <button type="button" onclick="togglePasswordVisibility()" aria-label="Tampilkan/sembunyikan password"
                        style="position:absolute;top:0;right:0;height:100%;width:38px;background:transparent;border:none;
                        cursor:pointer;display:flex;align-items:center;justify-content:center;color:#7B8794;padding:0;">
                        <svg id="id_password_icon_eye" xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg id="id_password_icon_eye_off" xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button class="btn btn-primary" type="submit" style="margin-top:8px;width:100%;">Masuk</button>
        </form>
    </div>
</div>
<script>
function togglePasswordVisibility() {
    const input = document.getElementById('id_password');
    const eye = document.getElementById('id_password_icon_eye');
    const eyeOff = document.getElementById('id_password_icon_eye_off');
    if (input.type === 'password') {
        input.type = 'text';
        eye.style.display = 'none';
        eyeOff.style.display = 'block';
    } else {
        input.type = 'password';
        eye.style.display = 'block';
        eyeOff.style.display = 'none';
    }
}
</script>
{% endblock %}
